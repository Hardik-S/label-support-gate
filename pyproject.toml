[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "label-support-gate"
version = "0.1.0"
description = "Offline declared-label support policy checker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
label-support-gate = "label_support_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
