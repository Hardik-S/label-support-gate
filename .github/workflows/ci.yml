name: CI

on:
  push:
  pull_request:

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install packaging backend
        run: python -m pip install setuptools wheel
      - name: Build local noneditable package without network dependencies
        run: python -m pip install --no-index --no-deps --no-build-isolation .
      - name: Run acceptance suite
        run: python acceptance.py
